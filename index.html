<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlash - Reserva de Entradas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container mt-4">
        <header class="text-center mb-5">
            <h1><i class="bi bi-film"></i> Bienvenidos a CineFlash</h1>
        </header>

        <main>
            <div class="row">
                <div class="col-md-4 mb-4">
                    <div class="card h-100">
                        <img src="https://image.tmdb.org/t/p/w500/8b8R8l88Qje9dn9OE8Ya0GGVpSg.jpg" class="card-img-top" alt="Duna Parte 2">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">Duna Parte 2</h5>
                            <button class="btn btn-primary mt-auto reservar-btn" data-pelicula="Duna Parte 2">Reservar</button>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 mb-4">
                    <div class="card h-100">
                        <img src="https://image.tmdb.org/t/p/w500/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg" class="card-img-top" alt="Oppenheimer">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">Oppenheimer</h5>
                            <button class="btn btn-primary mt-auto reservar-btn" data-pelicula="Oppenheimer">Reservar</button>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 mb-4">
                    <div class="card h-100">
                        <img src="https://image.tmdb.org/t/p/w500/iuFNMS8U5cb6xfzi51Dbkovj7vV.jpg" class="card-img-top" alt="Barbie">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">Barbie</h5>
                            <button class="btn btn-primary mt-auto reservar-btn" data-pelicula="Barbie">Reservar</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal fade" id="booking-modal" tabindex="-1" aria-labelledby="bookingModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="bookingModalLabel">Reserva de Entradas</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="booking-form">
                        <div class="mb-3">
                            <label for="pelicula-input" class="form-label">Película</label>
                            <input type="text" class="form-control" id="pelicula-input" disabled>
                        </div>
                        <div class="mb-3">
                            <label for="horario-select" class="form-label">Horario</label>
                            <select class="form-select" id="horario-select" required>
                                <option value="" selected disabled>Selecciona una hora</option>
                                <option value="18:00">18:00</option>
                                <option value="20:30">20:30</option>
                                <option value="22:45">22:45</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="asientos-input" class="form-label">Cantidad de Asientos</label>
                            <input type="number" class="form-control" id="asientos-input" min="1" max="10" required>
                        </div>
                        <hr>
                        <h6>Pago (simulado)</h6>
                        <div class="mb-3">
                            <label for="tarjeta-input" class="form-label">Número de tarjeta</label>
                            <input type="text" class="form-control" id="tarjeta-input" placeholder="**** **** **** 1234" required>
                        </div>
                        <div class="mb-3">
                            <label for="nombre-input" class="form-label">Nombre del titular</label>
                            <input type="text" class="form-control" id="nombre-input" required>
                        </div>
                        <div class="mb-3">
                            <label for="cvv-input" class="form-label">CVV</label>
                            <input type="text" class="form-control" id="cvv-input" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" id="confirmar-btn">Confirmar Reserva</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="/js/main.js"></script>

</body>
</html>
